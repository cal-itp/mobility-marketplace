name: mobimart
services:
  site:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: mobimart:site
    command: sleep infinity
    volumes:
      - ..:/home/mobimart/site
      - /home/mobimart/site/node_modules

  docs:
    image: mobimart:site
    entrypoint: mkdocs
    command: serve --dev-addr "0.0.0.0:8001"
    ports:
      - 8001:8001
    volumes:
      - ../:/home/mobimart/site
